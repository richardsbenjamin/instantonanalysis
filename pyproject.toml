[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instantonanalysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # Core science
  "numpy",
  "scipy",
  "pandas",
  "xarray",
  "dask",
  "zarr<3",
  # Geo / astronomy
  "cartopy",
  "pyproj",
  "pyshp",
  "shapely",
  "healpy",
  "reproject",
  # NetCDF / IO
  "netcdf4",
  "cftime",
  "numcodecs>=0.12,<0.13",
  "zarr<3",
  # Plotting
  "matplotlib",
  "pillow",
  "contourpy",
  # Jupyter / IPython
  "ipykernel",
  "ipython",
  "ipython-pygments-lexers",
  "jupyter-client",
  "jupyter-core",
  "matplotlib-inline",
  "debugpy",
  "comm",
  # HTTP / async
  "aiohttp",
  "requests",
  # Config / CLI
  "hydra-core",
  "donfig",
  "click",
  "pyyaml",
  # Utilities
  "tqdm",
  "joblib",
  "cloudpickle",
  "toolz",
  "packaging",
  "typing-extensions",
  "python-dateutil",
  "pytz",
  "tzdata",
  "six",
  "certifi",
  "scikit-learn>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
