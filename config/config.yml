defaults:
  - locations: paris
  - variables: t2m
  - _self_

paths:
  results_root: "./outputs"

analysis:
  calc_months_init: [5, 9]
  calc_months: [6, 8]
  nb_closest: 50
  rolling_periods: [1, 3, 5, 11, 15, 31]
  quantiles: [0.5, 0.75, 0.95, 0.99, 0.999, 0.9999]

xarray:
  time_dim: "valid_time"
  lon_dim: "longitude"
  lat_dim: "latitude"