defaults:
  - locations: paris
  - spatial: healpix
  - /variables@variables.t2m: t2m
  - /variables@variables.z500: z500
  - _self_

# Large-scale domain the location sits in; used for the weighted_var_tilde spatial mean.
domain_box: ${healpix_from_config:${nside},${locations.domain.box}}
nside: 64

variables:
  t2m:
    transpose: ["step", "face", "height", "width"]
  z500:
    transpose: ["step", "face", "height", "width"]

xconfig:
  time_dim: "step"

paths:
  data_root: "/home/benjamin/data"
  data_file: "daily_atmos_hpx64_100year.zarr"
  climate_mean: ${locations.season.climate_mean}
  climate_variance: ${locations.season.climate_variance}
  results_root: "./outputs/healpix_100year"
  auto_correlation: "auto_correlation.nc"
  closest_neighbours: "closest_neighbours.nc"
  quantile_threshold: "quantile_threshold.nc"
  series_obs: "series_obs.nc"
  composite_anomalies: "composite_anomalies.nc"
  normalised_var_tilde: "normalised_var_tilde.nc"
  weighted_var_tilde: "weighted_var_tilde.nc"
  normalised_var_hat: "normalised_var_hat.nc"
  chi_masks: "chi_masks.nc"

analysis:
  autocorr_days: 31
  calc_months_init: ${locations.season.calc_months_init}
  calc_months: ${locations.season.calc_months}
  dist_func: "squared_error"
  nb_closest: 50
  rolling_periods: [1, 5]
  quantiles: [0.75, 0.95, 0.99, 0.999]


