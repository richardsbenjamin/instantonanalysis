defaults:
    - _base_var

name: "t2m0"
alias: "t2m"
offset: -273.15
unit: "°C"
long_name: "Temperature"
contour_levels:
    composite: "${arange: -7, 8, 1}"
    var_hat_f: "${arange: 10, 32, 4}"
    var_hat: "${arange: 0, 70, 10}"
data_path: "t2m.nc"
climate_mean_path: "t2m_mean2.nc"
climate_var_path: "t2m_var2.nc"