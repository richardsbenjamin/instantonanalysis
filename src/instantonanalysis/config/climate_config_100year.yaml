# Run the climate_config_jja / climate_config_djf children rather than this directly.
defaults:
  - climate_config
  - /season@season: jja
  - _self_

preprocess:
  step_to_datetime: false
  transform: false
  resample: false

paths:
  data_root: "/home/benjamin/data"
  data_file: "daily_atmos_hpx64_100year.zarr"
  daily_data: null            # input is already the daily zarr
  climate_mean: ${season.climate_mean}
  climate_variance: ${season.climate_variance}

analysis:
  calc_months: ${season.calc_months}
